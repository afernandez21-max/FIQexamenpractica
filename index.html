<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joc de la Taula Periòdica</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .mode-select, .stats {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.active {
            background-color: #2ecc71;
        }
        .question-card {
            font-size: 48px;
            font-weight: bold;
            margin: 30px 0;
            color: #2c3e50;
            min-height: 70px;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        .feedback {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            min-height: 25px;
        }
        .correct { color: #2ecc71; }
        .incorrect { color: #e74c3c; }
        .score-board {
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧪 Joc de la Taula Periòdica</h1>
    
    <div class="mode-select">
        <button id="btn-sym-to-name" class="active" onclick="setMode('sym-to-name')">Símbol ➔ Nom</button>
        <button id="btn-name-to-sym" onclick="setMode('name-to-sym')">Nom ➔ Símbol</button>
    </div>

    <div class="stats">
        <div>Restants: <span id="stat-rem">0</span></div>
        <div>Encertades: <span id="stat-correct" class="correct">0</span></div>
        <div>Errades: <span id="stat-wrong" class="incorrect">0</span></div>
    </div>

    <div class="question-card" id="question-display">-</div>

    <input type="text" id="answer-input" placeholder="Escriu la teva resposta..." autocomplete="off">
    <br>
    <button onclick="checkAnswer()">Comprova</button>
    <button onclick="nextQuestion()" style="background-color: #95a5a6;">Omet</button>

    <div class="feedback" id="feedback-display"></div>
</div>

<script>
    // Els 38 elements de la imatge
    const elementsData = [
        { s: "H", n: ["hidrogen"] },
        { s: "Li", n: ["liti"] },
        { s: "Na", n: ["sodi"] },
        { s: "K", n: ["potassi"] },
        { s: "Rb", n: ["rubidi"] },
        { s: "Cs", n: ["cesi"] },
        { s: "Be", n: ["berilli", "beril·li"] },
        { s: "Mg", n: ["magnesi"] },
        { s: "Ca", n: ["calci"] },
        { s: "Sr", n: ["estronci"] },
        { s: "Ba", n: ["bari"] },
        { s: "Cr", n: ["crom"] },
        { s: "Mn", n: ["manganes", "manganès"] },
        { s: "Fe", n: ["ferro"] },
        { s: "Co", n: ["cobalt"] },
        { s: "Ni", n: ["niquel", "níquel"] },
        { s: "Cu", n: ["coure"] },
        { s: "Zn", n: ["zinc"] },
        { s: "Ag", n: ["plata", "argent"] },
        { s: "Cd", n: ["cadmi"] },
        { s: "Pt", n: ["platí", "plati"] },
        { s: "Au", n: ["or"] },
        { s: "Hg", n: ["mercuri"] },
        { s: "B", n: ["bor"] },
        { s: "Al", n: ["alumini"] },
        { s: "C", n: ["carboni"] },
        { s: "Si", n: ["silici"] },
        { s: "Sn", n: ["estany"] },
        { s: "Pb", n: ["plom"] },
        { s: "N", n: ["nitrogen"] },
        { s: "P", n: ["fosfor", "fòsfor"] },
        { s: "As", n: ["arsenic", "arsènic"] },
        { s: "Sb", n: ["antimoni"] },
        { s: "O", n: ["oxigen", "oxígen"] },
        { s: "S", n: ["sofre"] },
        { s: "Se", n: ["seleni"] },
        { s: "Te", n: ["tel·luri", "telluri"] },
        { s: "F", n: ["fluor", "flúor"] },
        { s: "Cl", n: ["clor"] },
        { s: "Br", n: ["brom"] },
        { s: "I", n: ["iode"] }
    ];

    let gamePool = [];
    let currentItem = null;
    let currentMode = 'sym-to-name'; // o 'name-to-sym'
    let scoreCorrect = 0;
    let scoreWrong = 0;

    // Funció per barrejar (algorisme Fisher-Yates)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initGame() {
        gamePool = [...elementsData];
        shuffleArray(gamePool); // <--- AIXÒ FA QUE SIGUI A BOLEO!
        scoreCorrect = 0;
        scoreWrong = 0;
        updateStats();
        nextQuestion();
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btn-sym-to-name').classList.toggle('active', mode === 'sym-to-name');
        document.getElementById('btn-name-to-sym').classList.toggle('active', mode === 'name-to-sym');
        initGame();
    }

    function updateStats() {
        document.getElementById('stat-rem').innerText = gamePool.length;
        document.getElementById('stat-correct').innerText = scoreCorrect;
        document.getElementById('stat-wrong').innerText = scoreWrong;
    }

    function nextQuestion() {
        document.getElementById('feedback-display').innerText = '';
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();

        if (gamePool.length === 0) {
            document.getElementById('question-display').innerText = "🎉 Fi del joc!";
            document.getElementById('feedback-display').innerHTML = "<span class='correct'>Has completat tots els elements! Tornant a començar...</span>";
            setTimeout(initGame, 3000);
            return;
        }

        currentItem = gamePool.pop();
        
        if (currentMode === 'sym-to-name') {
            document.getElementById('question-display').innerText = currentItem.s;
        } else {
            // Mostrem el primer nom oficial de la llista
            document.getElementById('question-display').innerText = currentItem.n[0].charAt(0).toUpperCase() + currentItem.n[0].slice(1);
        }
        updateStats();
    }

    function cleanString(str) {
        return str.toLowerCase()
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "") // Elimina acents
            .replace(/·/g, "") // Simplifica la ela geminada si l'usuari no la posa bé
            .trim();
    }

    function checkAnswer() {
        const userInput = cleanString(document.getElementById('answer-input').value);
        if (!userInput) return;

        let isCorrect = false;

        if (currentMode === 'sym-to-name') {
            // Comprovem si coincideix amb qualsevol dels noms acceptats
            isCorrect = currentItem.n.some(name => cleanString(name) === userInput);
        } else {
            // Comprovem si coincideix amb el símbol (ignorant majúscules)
            isCorrect = cleanString(currentItem.s) === userInput;
        }

        const feedback = document.getElementById('feedback-display');
        if (isCorrect) {
            feedback.innerHTML = "<span class='correct'>Correcte! ✨</span>";
            scoreCorrect++;
            setTimeout(nextQuestion, 1200);
        } else {
            const respostaCorrecta = currentMode === 'sym-to-name' ? currentItem.n[0] : currentItem.s;
            feedback.innerHTML = `<span class='incorrect'>Incorrecte ❌ La resposta era: <strong>${respostaCorrecta}</strong></span>`;
            scoreWrong++;
            // Tornem a col·locar l'element en una posició aleatòria per a que torni a sortir més tard
            gamePool.unshift(currentItem);
            shuffleArray(gamePool);
            setTimeout(nextQuestion, 2500);
        }
        updateStats();
    }

    // Permet prémer Enter per respondre
    document.getElementById('answer-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    // Iniciar al carregar la pàgina
    window.onload = initGame;
</script>

</body>
</html>
